services:
  web:
    build:
      context: .
      args:
        # Create React App inlines these at build time, so they belong here
        # rather than in `environment:`.
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:3006/api}
        REACT_APP_GOOGLE_MAPS_API_KEY: ${REACT_APP_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "3010:80"
