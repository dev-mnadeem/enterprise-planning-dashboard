name: Console checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn test --watchAll=false --runInBand
      - run: yarn build
        env:
          CI: "false"
